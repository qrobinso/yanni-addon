# https://contributors.home-assistant.io/apps/reference/configuration/
name: Yanni
version: "0.1.0"
slug: yanni
description: A friendly face for a wall tablet that sees, listens and talks through Home Assistant.
url: "https://github.com/qrobinso/yanni-addon"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
# Owner pages (pairing, displays, status) behind Home Assistant's login.
ingress: true
ingress_port: 8099
panel_icon: mdi:eye-outline
panel_title: Yanni
# The kiosk display opens this port directly: a secure context for the camera and microphone, no iframe.
# The owner can change the host port under the add-on's Network settings.
ports:
  8443/tcp: 8443
ports_description:
  8443/tcp: Kiosk display (HTTPS when the certificate below exists)
homeassistant_api: true
services:
  - mqtt:want
map:
  - type: ssl
options:
  certfile: fullchain.pem
  keyfile: privkey.pem
  default_room: Living Room
  discovery_prefix: homeassistant
schema:
  certfile: str
  keyfile: str
  default_room: str
  discovery_prefix: str
