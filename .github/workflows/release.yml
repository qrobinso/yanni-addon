# Builds the add-on image for each architecture and pushes it to GHCR, where Home Assistant pulls it
# (addon/config.yaml `image:`). Triggered by a version tag (v0.1.0) that must match addon/config.yaml.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Version from addon/config.yaml (must match the tag)
        run: |
          version=$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' addon/config.yaml)
          [ -n "$version" ] || { echo "no version in addon/config.yaml" >&2; exit 1; }
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match addon/config.yaml version $version" >&2; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: |
            web/public/models
            web/public/ort
            web/public/mediapipe
          key: models-${{ hashFiles('web/scripts/fetch-models.mjs', 'package-lock.json') }}
      - run: npm test
      # Fetches models, builds web + server, stages them into addon/rootfs/app and checks every runtime file is there.
      - run: sh scripts/stage-addon.sh
      - uses: actions/upload-artifact@v4
        with:
          name: addon-context
          path: addon/
          include-hidden-files: true
          retention-days: 3

  image:
    needs: stage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: addon-context
          path: addon
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: addon
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-addon-yanni:${{ needs.stage.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-addon-yanni:latest
          labels: |
            io.hass.version=${{ needs.stage.outputs.version }}
            io.hass.arch=${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
