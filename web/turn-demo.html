<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turn Detection Tuning</title>
<style>
  :root { --bg: #0e1116; --panel: #171b22; --line: #2a303a; --text: #e6e8eb; --dim: #8b93a1; --accent: #6cc4ff;
          --speech: #7be08f; --warn: #ffb35c; --bad: #ff6b6b; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  button { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px;
           padding: 8px 12px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; min-width: 0; }
  .panel h2 { font-size: 13px; color: var(--dim); margin: 0 0 8px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  canvas { width: 100%; height: 140px; display: block; background: #0b0e12; border-radius: 4px; }
  .bar { height: 14px; background: #0b0e12; border-radius: 7px; overflow: hidden; margin: 4px 0 10px; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width 40ms linear; }
  .phase { display: inline-block; padding: 2px 10px; border-radius: 10px; background: var(--line); font-weight: 600; }
  .phase.speech { background: var(--speech); color: #000; } .phase.evaluating { background: var(--warn); color: #000; }
  .phase.incomplete { background: #c792ea; color: #000; } .phase.waitingStop { background: #5e81ac; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 0; }
  dt { color: var(--dim); } dd { margin: 0; font-variant-numeric: tabular-nums; }
  #log { height: 220px; overflow: auto; font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap; }
  label.t { display: grid; grid-template-columns: 150px 1fr 56px; gap: 8px; align-items: center; margin: 4px 0; }
  input[type=range] { width: 100%; }
  .muted { color: var(--dim); }
</style>
</head>
<body>
<h1>Turn detection tuning <span class="muted">· Silero VAD + Smart Turn v3.2</span></h1>
<div class="row">
  <button id="start">Start mic</button>
  <button id="stop">Stop mic</button>
  <button id="babble">Play babble (echo test)</button>
  <button id="say">Speak a sentence (echo test)</button>
  <button id="bench">Benchmark models</button>
  <span id="msg" class="muted"></span>
</div>
<div class="grid">
  <div class="panel">
    <h2>VAD probability (last 10 s)</h2>
    <canvas id="plot" width="600" height="140"></canvas>
    <div class="muted" style="margin-top:6px">green: speech threshold · dim: silent threshold · orange band: Yanni audible</div>
  </div>
  <div class="panel">
    <h2>Live</h2>
    <div>Phase <span id="phase" class="phase">off</span></div>
    <div style="margin-top:8px">VAD p <span id="pv">0.00</span></div>
    <div class="bar"><div id="pbar"></div></div>
    <div>Mic level <span id="lv">0.00</span> <span id="ldb" class="muted"></span></div>
    <div class="bar"><div id="lbar" style="background:var(--speech)"></div></div>
    <dl id="status"></dl>
  </div>
  <div class="panel">
    <h2>Signals</h2>
    <div id="log"></div>
  </div>
  <div class="panel">
    <h2>Tunables (Sound → Listening)</h2>
    <div id="tunables"></div>
  </div>
</div>
<script type="module" src="/src/conversation/demo/turnDemo.ts"></script>
</body>
</html>
