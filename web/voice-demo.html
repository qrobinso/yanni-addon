<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Tuning</title>
<style>
  :root { --bg: #0e1116; --panel: #171b22; --line: #2a303a; --text: #e6e8eb; --dim: #8b93a1; --accent: #6cc4ff; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  button { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px;
           padding: 8px 12px; font: inherit; cursor: pointer; }
  button:hover, button:focus-visible { border-color: var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; min-width: 0; }
  .panel h2 { font-size: 13px; color: var(--dim); margin: 0 0 8px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  label.t { display: grid; grid-template-columns: 110px 1fr 52px; gap: 8px; align-items: center; margin: 4px 0; }
  input[type=range] { width: 100%; }
  textarea { width: 100%; min-height: 64px; background: #0b0e12; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 8px; font: inherit; }
  select { background: #0b0e12; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px; font: inherit; }
  canvas { width: 100%; height: 160px; display: block; background: #0b0e12; border-radius: 4px; }
  #notes { font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap; max-height: 260px; overflow: auto; }
  .muted { color: var(--dim); }
</style>
</head>
<body>
<h1>Voice tuning <span class="muted">· procedural chirps and babble</span></h1>
<div class="grid">
  <div class="panel">
    <h2>Mood</h2>
    <label class="t">Pleasure <input id="p" type="range" min="-1" max="1" step="0.05" value="0.2"><output for="p"></output></label>
    <label class="t">Arousal <input id="a" type="range" min="-1" max="1" step="0.05" value="0.15"><output for="a"></output></label>
    <label class="t">Dominance <input id="d" type="range" min="-1" max="1" step="0.05" value="0.1"><output for="d"></output></label>
    <label class="t">Volume <input id="vol" type="range" min="0" max="1" step="0.05" value="0.7"><output for="vol"></output></label>
    <div class="row">
      <label><input id="mute" type="checkbox"> Muted</label>
      <button id="seed">New seed</button>
      <button id="repeat">Repeat last</button>
    </div>
  </div>
  <div class="panel">
    <h2>Reactions</h2>
    <div class="row" id="reactions"></div>
  </div>
  <div class="panel">
    <h2>Reply babble</h2>
    <textarea id="text">Sure! The kitchen lights are on. Do you want the hallway too?</textarea>
    <div class="row">
      <label>Answer <select id="answer"><option value="">none</option><option>mmHm</option><option>mmHmBig</option><option>uhUh</option><option>nuhUh</option></select></label>
      <button id="say">Babble it</button>
    </div>
  </div>
  <div class="panel">
    <h2>Last phrase</h2>
    <canvas id="pitch" width="600" height="160"></canvas>
    <div id="notes" class="muted">Tap a reaction (the first tap unlocks audio).</div>
  </div>
</div>
<script type="module" src="/src/voice/demo.ts"></script>
</body>
</html>
